name: Deploy to GitHub Pages

on:
  push:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `vite.config.ts` derives the base path from GITHUB_REPOSITORY, which
      # Actions sets automatically: project sites are served from /<repo>/ and
      # <owner>.github.io sites from the root. Nothing to configure here.
      - name: Build
        run: npm run build

      # A wrong base path is the classic Pages failure: index.html loads, every
      # /assets/* request 404s, and the page renders blank with no visible error.
      # Fail loudly here instead of silently deploying a white screen.
      - name: Verify build output
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html was not produced"
            exit 1
          fi

          if [ ! -f dist/.nojekyll ]; then
            echo "::warning::dist/.nojekyll is missing — add an empty file at public/.nojekyll"
          fi

          if [ "$REPO_NAME" = "${REPO_NAME%.github.io}" ]; then
            EXPECTED="/${REPO_NAME}/assets/"
          else
            EXPECTED="/assets/"
          fi

          if ! grep -q "src=\"${EXPECTED}" dist/index.html; then
            echo "::error::index.html does not reference ${EXPECTED} — the deployed page would load but fail to fetch its bundle."
            echo "Referenced asset URLs:"
            grep -oE '(src|href)="/[^"]*"' dist/index.html || true
            exit 1
          fi

          echo "Build verified: assets are served from ${EXPECTED}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
