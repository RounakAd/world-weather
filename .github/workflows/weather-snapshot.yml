name: Weather snapshot

# Keeps `data/weather-cache.json` fresh so the site can show the day's real
# weather when Open-Meteo's free quota runs out. Uses only the workflow's own
# GITHUB_TOKEN — no personal token, and nothing secret in the public bundle.

on:
  # 00:30 and 06:30 and 12:30 UTC = 06:00 / 12:00 / 18:00 IST: morning seed,
  # midday refresh, evening refresh. adjust freely.
  schedule:
    - cron: '30 0 * * *'
    - cron: '30 6 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-snapshot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch and commit the snapshot
        run: node scripts/publish-weather-snapshot.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT_BRANCH: master
